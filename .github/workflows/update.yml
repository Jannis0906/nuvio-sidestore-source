name: Update Nuvio SideStore Source

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update source.json
        run: python update.py

      - name: Commit changes
        run: |
          if git diff --quiet source.json; then
            echo "No Nuvio update found."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source.json
          git commit -m "Update Nuvio SideStore source"
          git push
